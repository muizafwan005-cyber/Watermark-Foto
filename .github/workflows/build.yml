name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder android
        run: |
          flutter create --platforms=android --project-name watermark_foto --org com.example tmp_app
          cp -r tmp_app/android ./android
          rm -rf tmp_app

      - name: Tambah izin & nama aplikasi
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n'
          )
          s = s.replace('<application', perms + '    <application', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Watermark Foto"', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: watermark-foto-apk
          path: build/app/outputs/flutter-apk/app-release.apk
